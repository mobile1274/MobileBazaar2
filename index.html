function ConditionBadge({ condition }) {
  const map = {

    "Fair": { bg: C.coralSoft, fg: C.coral },
  };
  const s = map[condition] || map.Good;
  return (
    <span style={{ background: s.bg, color: s.fg, fontSize: 11.5, fontWeight: 600, padding: "3px 9px", borderRadius: 20 }}>
      {condition}
    </span>
  );
}

function PhoneCard({ phone, onOpenSeller }) {

            <div style={{ fontSize: 12.5, color: C.sub }}>{phone.storage}</div>

        <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 2 }}>
          <span style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, color: C.coral }}>{inr(phone.price)}</span>

          <span style={{ fontSize: 11.5, color: C.teal, fontWeight: 600 }}>{savings}% off</span>
        </div>
        <button onClick={() => onOpenSeller(seller.id)} style={{

function MarketView({ onOpenSeller }) {
  const [sort, setSort] = useState("recent");
  const [maxPrice, setMaxPrice] = useState(50000);
  const [query, setQuery] = useState("");

  const list = useMemo(() => {
    let r = PHONES.filter((p) => p.price <= maxPrice && p.name.toLowerCase().includes(query.toLowerCase()));
    if (sort === "low") r = [...r].sort((a, b) => a.price - b.price);
    if (sort === "high") r = [...r].sort((a, b) => b.price - a.price);
    return r;
  }, [sort, maxPrice, query]);

  return (
    <div style={{ maxWidth: 1080, margin: "0 auto", padding: "28px 24px" }}>
      <h1 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 26, color: C.ink, margin: "0 0 6px" }}>
        Second-hand mobiles, checked and priced upfront

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px", flex: "1 1 220px" }}>
          <Search size={15} color={C.sub} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search phone, e.g. iPhone 12"
            style={{ border: "none", outline: "none", fontSize: 13.5, width: "100%", fontFamily: "Inter, sans-serif" }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px" }}>
          <ArrowUpDown size={15} color={C.sub} />
          <select value={sort} onChange={(e) => setSort(e.target.value)} style={{ border: "none", outline: "none", fontSize: 13.5, fontFamily: "Inter, sans-serif", background: "transparent" }}>
            <option value="recent">Newest first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 12px" }}>
          <span style={{ fontSize: 12.5, color: C.sub, whiteSpace: "nowrap" }}>Up to {inr(maxPrice)}</span>
          <input type="range" min={5000} max={50000} step={1000} value={maxPrice} onChange={(e) => setMaxPrice(Number(e.target.value))} />
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 16 }}>
        {list.map((p) => <PhoneCard key={p.id} phone={p} onOpenSeller={onOpenSeller} />)}
      </div>
      {list.length === 0 && <p style={{ color: C.sub, fontSize: 13.5 }}>No phones match that search. Try widening the price range.</p>}
    </div>
  );
}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 16 }}>
        {listings.map((p) => <PhoneCard key={p.id} phone={p} onOpenSeller={() => {}} />)}
      </div>
    </div>
  );
}

function Th({ children }) {
  return <th style={{ textAlign: "left", fontSize: 11.5, color: C.sub, fontWeight: 600, padding: "8px 10px", borderBottom: `1px solid ${C.line}` }}>{children}</th>;
}
function Td({ children }) {
  return <td style={{ fontSize: 13, color: C.ink, padding: "10px 10px", borderBottom: `1px solid ${C.line}` }}>{children}</td>;
}
function Pill({ text, tone = "teal" }) {
  const map = { teal: [C.tealSoft, C.teal], coral: [C.coralSoft, C.coral], amber: [C.amberSoft, C.amber] };
  const [bg, fg] = map[tone] || map.teal;
  return <span style={{ background: bg, color: fg, fontSize: 11, fontWeight: 600, padding: "3px 9px", borderRadius: 20 }}>{text}</span>;
}
function SmallBtn({ children, onClick, tone = "line" }) {
  const styles = tone === "teal"
    ? { background: C.teal, color: "#fff", border: "none" }
    : tone === "coral"
    ? { background: "transparent", color: C.coral, border: `1px solid ${C.coral}` }
    : { background: "transparent", color: C.ink, border: `1px solid ${C.line}` };
  return (
    <button onClick={onClick} style={{ ...styles, fontSize: 12, fontWeight: 600, padding: "5px 10px", borderRadius: 6, cursor: "pointer", fontFamily: "Inter, sans-serif" }}>
      {children}
    </button>
  );
}

function AdminCredentialsForm({ adminId, setAdminId, adminPassword, setAdminPassword }) {
  const [newId, setNewId] = useState(adminId);
  const [currentPw, setCurrentPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [error, setError] = useState("");
  const [saved, setSaved] = useState(false);

  const save = () => {
    setSaved(false);
    if (newId.trim() === "") { setError("User ID khali nahi ho sakta"); return; }
    const changingPw = currentPw || newPw || confirmPw;
    if (changingPw) {
      if (currentPw !== adminPassword) { setError("Current password galat hai"); return; }
      if (newPw.length < 4) { setError("Naya password kam se kam 4 characters ka ho"); return; }
      if (newPw !== confirmPw) { setError("Naya password aur confirm password match nahi kar rahe"); return; }
    }
    setError("");
    setAdminId(newId.trim());
    if (changingPw) setAdminPassword(newPw);
    setCurrentPw(""); setNewPw(""); setConfirmPw("");
    setSaved(true);
  };

  const inputStyle = { display: "block", marginTop: 4, width: "100%", padding: "8px 10px", border: `1px solid ${C.line}`, borderRadius: 6, fontSize: 13, boxSizing: "border-box" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, maxWidth: 380 }}>
      <label style={{ fontSize: 13, color: C.ink }}>Admin user ID
        <input value={newId} onChange={(e) => setNewId(e.target.value)} style={inputStyle} />
      </label>
      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 12 }}>
        <p style={{ fontSize: 12.5, color: C.sub, margin: "0 0 10px" }}>Password badalne ke liye neeche bharein, warna khali chhod dein.</p>
        <label style={{ fontSize: 13, color: C.ink }}>Current password
          <input type="password" value={currentPw} onChange={(e) => setCurrentPw(e.target.value)} style={inputStyle} />
        </label>
        <label style={{ fontSize: 13, color: C.ink, display: "block", marginTop: 12 }}>New password
          <input type="password" value={newPw} onChange={(e) => setNewPw(e.target.value)} style={inputStyle} />
        </label>
        <label style={{ fontSize: 13, color: C.ink, display: "block", marginTop: 12 }}>Confirm new password
          <input type="password" value={confirmPw} onChange={(e) => setConfirmPw(e.target.value)} style={inputStyle} />
        </label>
      </div>
      {error && <p style={{ fontSize: 12, color: C.coral, margin: 0 }}>{error}</p>}
      {saved && <p style={{ fontSize: 12, color: C.teal, margin: 0 }}>Login details update ho gaye.</p>}
      <SmallBtn tone="teal" onClick={save}>Save login details</SmallBtn>
    </div>
  );
}

function AdminLogin({ adminId, adminPassword, onSuccess, onCancel }) {
  const [userId, setUserId] = useState("");

  const [error, setError] = useState("");

  const submit = (e) => {
    e.preventDefault();
    if (userId.trim() === "" || password.trim() === "") {
      setError("User ID aur password daaliye");
      return;
    }
    if (userId !== adminId || password !== adminPassword) {
      setError("Galat User ID ya password, dobara try karein");
      return;
    }
    onSuccess();
  };

  const inputStyle = { width: "100%", padding: "9px 12px", border: `1px solid ${error ? C.coral : C.line}`, borderRadius: 7, fontSize: 13.5, boxSizing: "border-box" };

  return (

        <div style={{ width: 40, height: 40, borderRadius: "50%", background: C.tealSoft, color: C.teal, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>

        <p style={{ fontSize: 12.5, color: C.sub, margin: "0 0 16px" }}>Yeh section sirf admin team ke liye hai.</p>
        <input
          value={userId}
          onChange={(e) => { setUserId(e.target.value); setError(""); }}
          placeholder="User ID"
          style={{ ...inputStyle, marginBottom: 10 }}
        />
        <input
          type="password"
          value={password}
          onChange={(e) => { setPassword(e.target.value); setError(""); }}
          placeholder="Password"
          style={inputStyle}
        />
        {error && <p style={{ fontSize: 12, color: C.coral, margin: "6px 0 0" }}>{error}</p>}

          <SmallBtn tone="teal">Login</SmallBtn>

        </div>

}

function SellerAuth({ extraSellers, addSeller, onSuccess, onCancel }) {
  const [tab, setTab] = useState("login");
  const [name, setName] = useState("");
  const [mobile, setMobile] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");

  const inputStyle = { width: "100%", padding: "9px 12px", border: `1px solid ${error ? C.coral : C.line}`, borderRadius: 7, fontSize: 13.5, boxSizing: "border-box" };
  const allSellers = () => [...Object.values(SELLERS), ...extraSellers];

  const submitLogin = (e) => {
    e.preventDefault();
    if (mobile.trim() === "" || password.trim() === "") {
      setError("Mobile number aur password daaliye");
      return;
    }
    const match = allSellers().find((s) => s.mobile === mobile.trim() && s.password === password);
    if (!match) {
      setError("Galat mobile number ya password");
      return;
    }
    onSuccess(match.id);
  };

  const submitSignup = (e) => {
    e.preventDefault();
    if (!name.trim() || !mobile.trim() || !password.trim()) {
      setError("Naam, mobile number aur password bharna zaroori hai");
      return;
    }
    if (!/^\d{10}$/.test(mobile.trim())) {
      setError("10 digit ka valid mobile number daalein");
      return;
    }
    if (password.length < 4) {
      setError("Password kam se kam 4 characters ka ho");
      return;
    }
    if (password !== confirmPassword) {
      setError("Password aur confirm password match nahi kar rahe");
      return;
    }
    if (allSellers().some((s) => s.mobile === mobile.trim())) {
      setError("Yeh mobile number pehle se registered hai, login karein");
      return;
    }
    const newSeller = {
      id: `s${Date.now()}`, name: name.trim(), mobile: mobile.trim(), password,
      verified: false, location: "Not added yet", memberSince: "September 2026",
      totalListings: 0, sold: 0, rating: 0, reviews: 0, responseRate: "-", responseTime: "-",
    };
    addSeller(newSeller);
    onSuccess(newSeller.id);
  };

  const switchTab = (t) => { setTab(t); setError(""); setPassword(""); setConfirmPassword(""); };

  return (
    <div style={{ minHeight: "70vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 28, width: "100%", maxWidth: 360 }}>
        <div style={{ width: 40, height: 40, borderRadius: "50%", background: C.tealSoft, color: C.teal, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
          <Store size={18} />
        </div>
        <div style={{ display: "flex", gap: 4, background: C.bg, padding: 4, borderRadius: 8, marginBottom: 18 }}>
          <button onClick={() => switchTab("login")} style={{ flex: 1, padding: "7px 0", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: tab === "login" ? C.teal : "transparent", color: tab === "login" ? "#fff" : C.sub, fontFamily: "Inter, sans-serif" }}>Login</button>
          <button onClick={() => switchTab("signup")} style={{ flex: 1, padding: "7px 0", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: tab === "signup" ? C.teal : "transparent", color: tab === "signup" ? "#fff" : C.sub, fontFamily: "Inter, sans-serif" }}>Sign up</button>
        </div>

        {tab === "login" ? (
          <form onSubmit={submitLogin}>
            <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 18, color: C.ink, margin: "0 0 4px" }}>Seller login</h2>
            <p style={{ fontSize: 12.5, color: C.sub, margin: "0 0 16px" }}>Apni listings aur profile manage karne ke liye login karein.</p>
            <input value={mobile} onChange={(e) => { setMobile(e.target.value); setError(""); }} placeholder="Mobile number" style={{ ...inputStyle, marginBottom: 10 }} />
            <input type="password" value={password} onChange={(e) => { setPassword(e.target.value); setError(""); }} placeholder="Password" style={inputStyle} />
            {error && <p style={{ fontSize: 12, color: C.coral, margin: "6px 0 0" }}>{error}</p>}
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <SmallBtn tone="teal">Login</SmallBtn>
              <SmallBtn onClick={onCancel}>Cancel</SmallBtn>
            </div>
            <p style={{ fontSize: 11, color: C.sub, marginTop: 14 }}>Demo mobile: 9876543210 &middot; Password: seller123</p>
          </form>
        ) : (
          <form onSubmit={submitSignup}>
            <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 18, color: C.ink, margin: "0 0 4px" }}>Seller sign up</h2>
            <p style={{ fontSize: 12.5, color: C.sub, margin: "0 0 16px" }}>Mobile number se naya seller account banayein.</p>
            <input value={name} onChange={(e) => { setName(e.target.value); setError(""); }} placeholder="Full name" style={{ ...inputStyle, marginBottom: 10 }} />
            <input value={mobile} onChange={(e) => { setMobile(e.target.value); setError(""); }} placeholder="Mobile number" style={{ ...inputStyle, marginBottom: 10 }} />
            <input type="password" value={password} onChange={(e) => { setPassword(e.target.value); setError(""); }} placeholder="Password" style={{ ...inputStyle, marginBottom: 10 }} />
            <input type="password" value={confirmPassword} onChange={(e) => { setConfirmPassword(e.target.value); setError(""); }} placeholder="Confirm password" style={inputStyle} />
            {error && <p style={{ fontSize: 12, color: C.coral, margin: "6px 0 0" }}>{error}</p>}
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <SmallBtn tone="teal">Create account</SmallBtn>
              <SmallBtn onClick={onCancel}>Cancel</SmallBtn>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

function SellerDashboard({ sellerId, extraSellers, onExit }) {
  const seller = SELLERS[sellerId] || extraSellers.find((s) => s.id === sellerId);
  const [listings, setListings] = useState(PHONES.filter((p) => p.sellerId === sellerId));
  const [form, setForm] = useState({ name: "", storage: "", condition: "Good", price: "", mrp: "" });
  const [error, setError] = useState("");

  const addListing = () => {
    if (!form.name.trim() || !form.price || !form.mrp) {
      setError("Naam, price aur MRP bharna zaroori hai");
      return;
    }
    setError("");
    setListings([...listings, {
      id: Date.now(), name: form.name, storage: form.storage || "N/A", condition: form.condition,
      price: Number(form.price), mrp: Number(form.mrp), sellerId, posted: "Just now",
    }]);
    setForm({ name: "", storage: "", condition: "Good", price: "", mrp: "" });
  };

  const removeListing = (id) => setListings(listings.filter((l) => l.id !== id));

  const inputStyle = { padding: "8px 10px", border: `1px solid ${C.line}`, borderRadius: 6, fontSize: 13 };

  return (
    <div style={{ maxWidth: 1080, margin: "0 auto", padding: "24px 24px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 44, height: 44, borderRadius: "50%", background: C.tealSoft, color: C.teal, fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>
            {seller.name[0]}
          </div>
          <div>
            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 18, color: C.ink }}>{seller.name}</div>
            <div style={{ fontSize: 12, color: C.sub }}>{seller.location}</div>
          </div>
        </div>
        <SmallBtn onClick={onExit}>Log out</SmallBtn>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 12, marginBottom: 24 }}>
        <StatBox label="Rating" value={seller.rating} />
        <StatBox label="Devices sold" value={seller.sold} />
        <StatBox label="Response rate" value={seller.responseRate} />
        <StatBox label="Active listings" value={listings.length} />
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, marginBottom: 24 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: C.ink, marginBottom: 12 }}>Naya phone list karein</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10, marginBottom: 10 }}>
          <input placeholder="Phone name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} />
          <input placeholder="Storage e.g. 128GB" value={form.storage} onChange={(e) => setForm({ ...form, storage: e.target.value })} style={inputStyle} />
          <select value={form.condition} onChange={(e) => setForm({ ...form, condition: e.target.value })} style={inputStyle}>
            <option>Like new</option><option>Good</option><option>Fair</option>
          </select>
          <input placeholder="Selling price" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} style={inputStyle} />
          <input placeholder="Original MRP" value={form.mrp} onChange={(e) => setForm({ ...form, mrp: e.target.value })} style={inputStyle} />
        </div>
        {error && <p style={{ fontSize: 12, color: C.coral, margin: "0 0 8px" }}>{error}</p>}
        <SmallBtn tone="teal" onClick={addListing}><Plus size={12} style={{ verticalAlign: -1 }} /> Add listing</SmallBtn>
      </div>

      <div style={{ fontSize: 13.5, fontWeight: 600, color: C.ink, marginBottom: 12 }}>Meri listings</div>
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr><Th>Phone</Th><Th>Storage</Th><Th>Condition</Th><Th>Price</Th><Th>Posted</Th><Th></Th></tr></thead>
        <tbody>
          {listings.map((l) => (
            <tr key={l.id}>
              <Td>{l.name}</Td><Td>{l.storage}</Td><Td><ConditionBadge condition={l.condition} /></Td>
              <Td>{inr(l.price)}</Td><Td>{l.posted}</Td>
              <Td><SmallBtn tone="coral" onClick={() => removeListing(l.id)}><Trash2 size={12} style={{ verticalAlign: -1 }} /> Remove</SmallBtn></Td>
            </tr>
          ))}
          {listings.length === 0 && <tr><Td>Koi listing nahi hai. Upar se ek jodiye.</Td><Td></Td><Td></Td><Td></Td><Td></Td><Td></Td></tr>}
        </tbody>
      </table>
    </div>
  );
}

export default function App() {
  const [view, setView] = useState("market");
  const [sellerId, setSellerId] = useState("s1");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminId, setAdminId] = useState("admin");
  const [adminPassword, setAdminPassword] = useState("admin123");
  const [loggedInSellerId, setLoggedInSellerId] = useState(null);
  const [extraSellers, setExtraSellers] = useState([]);

  const openSeller = (id) => { setSellerId(id); setView("seller"); };
  const exitAdmin = () => { setAdminUnlocked(false); setView("market"); };
  const exitSellerPanel = () => { setLoggedInSellerId(null); setView("market"); };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "Inter, sans-serif" }}>
      <style>{fontImport}</style>

      {view !== "admin" && view !== "sellerPanel" && <Header view={view} setView={setView} />}

      {view === "market" && <MarketView onOpenSeller={openSeller} />}
      {view === "seller" && <SellerView sellerId={sellerId} setView={setView} />}

      {view === "sellerPanel" && !loggedInSellerId && (
        <SellerAuth
          extraSellers={extraSellers}
          addSeller={(s) => setExtraSellers([...extraSellers, s])}
          onSuccess={(id) => setLoggedInSellerId(id)}
          onCancel={() => setView("market")}
        />
      )}
      {view === "sellerPanel" && loggedInSellerId && (
        <SellerDashboard sellerId={loggedInSellerId} extraSellers={extraSellers} onExit={exitSellerPanel} />
      )}

      {view === "admin" && !adminUnlocked && (
        <AdminLogin adminId={adminId} adminPassword={adminPassword} onSuccess={() => setAdminUnlocked(true)} onCancel={() => setView("market")} />
      )}
      {view === "admin" && adminUnlocked && (
        <div>
          <div style={{ borderBottom: `1px solid ${C.line}`, background: C.paper }}>
            <div style={{ maxWidth: 1080, margin: "0 auto", padding: "16px 24px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 20, color: C.ink }}>Punarphone admin</span>
              <SmallBtn onClick={exitAdmin}>Exit to website</SmallBtn>
            </div>
          </div>
          <AdminView adminId={adminId} setAdminId={setAdminId} adminPassword={adminPassword} setAdminPassword={setAdminPassword} />
        </div>
      )}

      {view !== "admin" && view !== "sellerPanel" && <Footer onStaffClick={() => setView("admin")} />}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
